name: Tests

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: ['**']

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Generate test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: JUnit Test Results
          path: '**/build/test-results/test/*.xml'
          reporter: java-junit
          fail-on-error: true

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: '**/build/reports/jacoco/test/jacocoTestReport.xml'
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: xwal_test
          POSTGRES_USER: xwal
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run persistence integration tests
        run: ./gradlew :adapters:driven:persistence:test --no-daemon --stacktrace

  architecture-check:
    name: Architecture Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run architecture tests
        run: ./gradlew :app:test --no-daemon --tests "com.xwal.ArchitectureTest"

      - name: Verify hexagon is framework-free
        run: |
          for module in hexagon:core hexagon:ports hexagon:application; do
            echo "=== Checking $module ==="
            if ./gradlew :$module:dependencies --configuration compileClasspath --no-daemon 2>&1 | grep -qi micronaut; then
              echo "FAIL: $module has Micronaut dependency!"
              exit 1
            fi
            echo "CLEAN"
          done

  iwm-validation:
    name: IWM Schema Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON Schema
        run: jq '.' hexagon/core/src/main/resources/schema/iwm.schema.json > /dev/null
